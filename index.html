<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Utama — Penjana Infografik SITREP (4 Slot)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --biru: #1746a2;
    --biru-gelap: #0d2f6e;
    --merah: #c8102e;
    --kuning: #f5b301;
    --hijau: #2e9e44;
    --abu: #b9c0c9;
    --teks: #1c1c1c;
    --bg-app: #eef1f6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:'Poppins',Arial,sans-serif;
    background:var(--bg-app);
    color:var(--teks);
  }
  .shell{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- HEADER APP UTAMA ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:12px 20px;
    background:linear-gradient(135deg, var(--biru-gelap), var(--biru));
    color:#fff;
    flex-shrink:0;
    box-shadow:0 2px 10px rgba(13,47,110,.25);
    z-index:5;
  }
  .app-title{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .app-title .logo-badge{
    width:34px;height:34px;
    border-radius:8px;
    background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .app-title h1{
    font-size:15px;
    font-weight:800;
    margin:0;
    letter-spacing:.01em;
  }
  .app-title .sub{
    font-size:11px;
    font-weight:500;
    opacity:.85;
    margin-top:1px;
  }
  .app-header .tagline{
    font-size:11px;
    font-weight:700;
    background:rgba(255,255,255,.14);
    padding:5px 10px;
    border-radius:20px;
    white-space:nowrap;
  }

  /* ---------- TAB BAR ---------- */
  .tab-bar{
    display:flex;
    align-items:stretch;
    gap:2px;
    padding:10px 16px 0;
    background:#fff;
    border-bottom:1px solid #dbe0e8;
    flex-shrink:0;
    overflow-x:auto;
  }
  .tab-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    border:none;
    background:transparent;
    cursor:pointer;
    font-family:'Poppins',Arial,sans-serif;
    font-size:13px;
    font-weight:700;
    color:#6a7280;
    border-radius:8px 8px 0 0;
    white-space:nowrap;
    transition:background .12s ease, color .12s ease;
  }
  .tab-btn:hover{
    background:#f2f5fa;
    color:var(--biru-gelap);
  }
  .tab-btn .dot{
    width:8px;height:8px;
    border-radius:50%;
    background:var(--abu);
    flex-shrink:0;
    transition:background .12s ease;
  }
  .tab-btn.active{
    color:var(--biru-gelap);
    background:var(--bg-app);
  }
  .tab-btn.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:3px;
    background:var(--biru);
    border-radius:3px 3px 0 0;
  }
  .tab-btn.active .dot{
    background:var(--biru);
  }
  .tab-btn .rename{
    border:none;
    background:transparent;
    font:inherit;
    font-weight:700;
    color:inherit;
    width:90px;
    padding:0;
    outline:none;
  }
  .tab-btn .rename:focus{
    text-decoration:underline;
  }

  /* ---------- KAWASAN IFRAME ---------- */
  .frame-area{
    position:relative;
    flex:1;
    min-height:0;
  }
  .frame-area iframe{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    border:none;
    background:#fff;
    display:none;
  }
  .frame-area iframe.active{
    display:block;
  }

  /* Skrin muat awal ringkas */
  .boot-hint{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8992a0;
    font-size:12px;
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="shell">

  <header class="app-header">
    <div class="app-title">
      <div class="logo-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4-4 5-4 9a4 4 0 0 0 8 0c0-1.5-1-2.5-1-2.5s2 1 2 4.5a6 6 0 1 1-12 0C5 8 9 6 12 2z"/></svg>
      </div>
      <div>
        <h1>Penjana Infografik SITREP</h1>
        <div class="sub">App Utama — JBPM Johor · 4 Slot Insiden Serentak</div>
      </div>
    </div>
    <div class="tagline">"Cepat Dan Mesra"</div>
  </header>

  <nav class="tab-bar" id="tabBar" role="tablist">
    <!-- Tab dijana oleh JS di bawah -->
  </nav>

  <div class="frame-area" id="frameArea">
    <div class="boot-hint" id="bootHint">Memuatkan penjana…</div>
    <!-- iframe dijana oleh JS di bawah -->
  </div>

</div>

<script>
  // Setiap slot memuatkan generator.html sebagai dokumen BERASINGAN sepenuhnya
  // (window/DOM/JS sendiri) — jadi data Sektor/Gambar/dsb di Slot 1 tidak akan
  // pernah bercampur dengan Slot 2/3/4. Tukar tab hanya sorok/tunjuk iframe,
  // TIDAK memuat semula, supaya borang yang sedang diisi tidak hilang.
  const SLOTS = [
    { id: "slot1", label: "Insiden 1" },
    { id: "slot2", label: "Insiden 2" },
    { id: "slot3", label: "Insiden 3" },
    { id: "slot4", label: "Insiden 4" }
  ];
  const GENERATOR_SRC = "index.html";

  const tabBar = document.getElementById("tabBar");
  const frameArea = document.getElementById("frameArea");
  const bootHint = document.getElementById("bootHint");

  let activeSlot = SLOTS[0].id;
  let loadedCount = 0;

  function setActive(slotId){
    activeSlot = slotId;
    document.querySelectorAll(".tab-btn").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.slot === slotId);
    });
    document.querySelectorAll(".frame-area iframe").forEach(f=>{
      f.classList.toggle("active", f.dataset.slot === slotId);
    });
  }

  SLOTS.forEach((slot, idx)=>{
    // --- Tab button ---
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (idx === 0 ? " active" : "");
    btn.dataset.slot = slot.id;
    btn.setAttribute("role","tab");
    btn.innerHTML = `<span class="dot"></span><input class="rename" value="${slot.label}" spellcheck="false">`;
    btn.addEventListener("click", (e)=>{
      // Elak klik pada kotak nama sendiri menutup fokus semasa taip
      if(e.target.tagName === "INPUT") return;
      setActive(slot.id);
    });
    const renameInput = btn.querySelector(".rename");
    renameInput.addEventListener("click", (e)=> e.stopPropagation());
    renameInput.addEventListener("focus", ()=> setActive(slot.id));
    tabBar.appendChild(btn);

    // --- iframe (dimuatkan sekali sahaja, kekal dalam DOM) ---
    const iframe = document.createElement("iframe");
    iframe.src = GENERATOR_SRC;
    iframe.dataset.slot = slot.id;
    iframe.title = slot.label;
    if(idx === 0) iframe.classList.add("active");
    iframe.addEventListener("load", ()=>{
      loadedCount++;
      if(loadedCount >= SLOTS.length && bootHint) bootHint.remove();
    });
    frameArea.appendChild(iframe);
  });

  setActive(SLOTS[0].id);
</script>
</body>
</html>
